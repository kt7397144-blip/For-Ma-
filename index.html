<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>မမအတွက် ဖြူ့ရဲ့ Little Care Surprise 🤍</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"Noto Sans Myanmar","Myanmar Text",sans-serif;
  background:#050511;
  color:white;
}

#app{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 20%),
  radial-gradient(circle at 80% 30%,rgba(255,170,220,.13),transparent 25%),
  linear-gradient(145deg,#050511,#11132d 50%,#090817);
}

.scene{
  position:absolute;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  padding:35px 18px 70px;

  overflow-y:auto;
  text-align:center;

  animation:fade .65s ease;
}

.scene.active{
  display:flex;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(20px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card{
  width:min(94vw,520px);
  max-height:88vh;
  overflow-y:auto;

  padding:30px 22px;

  border-radius:30px;

  background:rgba(255,255,255,.09);

  border:1px solid rgba(255,255,255,.18);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  box-shadow:
  0 20px 70px rgba(0,0,0,.4),
  inset 0 1px rgba(255,255,255,.1);
}

.card::-webkit-scrollbar{
  width:0;
}

h1{
  font-size:clamp(30px,8vw,46px);
  line-height:1.4;
  margin-bottom:18px;
}

h2{
  font-size:clamp(23px,6vw,34px);
  line-height:1.5;
  margin-bottom:18px;
}

p{
  font-size:clamp(16px,4.4vw,20px);
  line-height:2;
  margin:8px 0;
}

.big{
  font-size:clamp(22px,6vw,32px);
  line-height:1.7;
}

.small{
  font-size:14px;
  opacity:.75;
  line-height:1.8;
}

.highlight{
  color:#ffd9ed;
  font-weight:bold;
}

.glow{
  text-shadow:0 0 25px rgba(255,200,235,.55);
}

.emoji{
  font-size:48px;
  margin-bottom:14px;
}

.divider{
  width:80px;
  height:2px;
  margin:20px auto;
  border-radius:20px;
  background:rgba(255,255,255,.3);
}

.checklist{
  display:flex;
  flex-direction:column;
  gap:10px;

  margin:18px 0;

  text-align:left;
}

.check{
  padding:12px 14px;

  border-radius:16px;

  background:rgba(255,255,255,.07);

  font-size:16px;
  line-height:1.7;
}

button{
  border:none;
  outline:none;

  margin:7px;
  padding:14px 20px;

  border-radius:999px;

  color:white;
  background:rgba(255,255,255,.14);

  border:1px solid rgba(255,255,255,.2);

  font-family:inherit;
  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  transition:.25s;
}

button:active{
  transform:scale(.94);
}

.primary{
  background:linear-gradient(135deg,#ff9fcf,#bda7ff);
  color:#28152d;
}

#progress{
  position:fixed;
  top:13px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:4px;

  max-width:90vw;

  flex-wrap:wrap;
  justify-content:center;

  z-index:100;
}

.dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:rgba(255,255,255,.25);

  transition:.3s;
}

.dot.active{
  width:18px;
  background:white;
  border-radius:10px;
}

#hint{
  position:fixed;

  bottom:15px;
  left:50%;

  transform:translateX(-50%);

  font-size:13px;

  opacity:.5;

  z-index:100;
}

.star{
  position:fixed;

  width:3px;
  height:3px;

  border-radius:50%;

  background:white;

  opacity:.7;

  pointer-events:none;

  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{
    opacity:.15;
    transform:scale(.7);
  }

  to{
    opacity:1;
    transform:scale(1.5);
  }
}

.heart{
  position:fixed;

  pointer-events:none;

  z-index:200;

  animation:heartFloat 3s ease-out forwards;
}

@keyframes heartFloat{
  0%{
    opacity:1;
    transform:translateY(0) scale(.7);
  }

  100%{
    opacity:0;
    transform:translateY(-300px) scale(1.5) rotate(25deg);
  }
}

.confetti{
  position:fixed;

  width:8px;
  height:8px;

  z-index:190;

  pointer-events:none;

  animation:fall 2.2s ease-out forwards;
}

@keyframes fall{
  0%{
    opacity:1;
    transform:translate(0,0) rotate(0);
  }

  100%{
    opacity:0;
    transform:
      translate(var(--x),var(--y))
      rotate(700deg);
  }
}

.envelope{
  width:220px;
  height:150px;

  margin:25px auto;

  position:relative;

  background:linear-gradient(145deg,#fff,#ffddeb);

  border-radius:12px;

  box-shadow:
    0 20px 50px rgba(255,180,220,.3);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#70465f;

  padding:20px;
}

.envelope:before{
  content:"";

  position:absolute;

  top:0;
  left:0;

  border-left:110px solid transparent;
  border-right:110px solid transparent;
  border-top:75px solid #f2c7df;
}

.envelope span{
  position:relative;
  z-index:2;

  font-size:13px;
  line-height:1.7;

  font-weight:bold;
}

.final{
  background:
  radial-gradient(
    circle at 50% 30%,
    rgba(255,200,235,.18),
    transparent 30%
  ),
  radial-gradient(
    circle at 30% 80%,
    rgba(180,180,255,.12),
    transparent 30%
  );
}

.question{
  font-size:clamp(23px,6vw,32px);
  line-height:1.7;
  font-weight:bold;
}
</style>
</head>

let current = 0;

const app =
document.getElementById("app");

const progress =
document.getElementById("progress");


function createScenes(){

  scenes.forEach((html,index)=>{

    const scene =
    document.createElement("section");

    scene.className="scene";

    if(index===0){
      scene.classList.add("active");
    }

    scene.innerHTML=html;

    app.appendChild(scene);

  });

  createProgress();
}


function createProgress(){

  progress.innerHTML="";

  scenes.forEach((_,index)=>{

    const dot =
    document.createElement("div");

    dot.className="dot";

    if(index===current){
      dot.classList.add("active");
    }

    progress.appendChild(dot);

  });

}


function showScene(index){

  if(index<0){
    index=0;
  }

  if(index>=scenes.length){
    index=scenes.length-1;
  }

  const all =
  document.querySelectorAll(".scene");

  all.forEach((scene,i)=>{

    scene.classList.toggle(
      "active",
      i===index
    );

  });

  current=index;

  const dots =
  document.querySelectorAll(".dot");

  dots.forEach((dot,i)=>{

    dot.classList.toggle(
      "active",
      i===current
    );

  });

  if(current===scenes.length-1){

    document.getElementById("hint")
    .textContent="🤍";

  }else{

    document.getElementById("hint")
    .textContent="tap to continue 🤍";

  }

}


function nextScene(){

  if(current<scenes.length-1){

    createHearts(3);

    showScene(current+1);

  }

}


function previousScene(){

  if(current>0){

    showScene(current-1);

  }

}


function answer(event){

  event.stopPropagation();

  createConfetti();
  createHearts(20);

  setTimeout(()=>{

    showScene(current+1);

  },350);

}


function restart(event){

  event.stopPropagation();

  createHearts(8);

  showScene(0);

}


/* TAP */

document.addEventListener(
"click",
function(event){

  if(
    event.target.tagName==="BUTTON" ||
    event.target.closest("button")
  ){
    return;
  }

  nextScene();

});


/* SWIPE */

let touchStartY=0;

let touchEndY=0;


document.addEventListener(
"touchstart",
function(e){

  touchStartY =
  e.changedTouches[0].screenY;

},
{passive:true}
);


document.addEventListener(
"touchend",
function(e){

  touchEndY =
  e.changedTouches[0].screenY;

  const difference =
  touchStartY-touchEndY;

  if(Math.abs(difference)>60){

    if(difference>0){

      nextScene();

    }else{

      previousScene();

    }

  }

},
{passive:true}
);


/* STARS */

function createStars(){

  for(let i=0;i<90;i++){

    const star =
    document.createElement("div");

    star.className="star";

    star.style.left =
    Math.random()*100+"%";

    star.style.top =
    Math.random()*100+"%";

    star.style.animationDelay =
    Math.random()*3+"s";

    const size =
    Math.random()*3+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    document.body.appendChild(star);

  }

}


/* HEARTS */

function createHearts(amount=5){

  const emojis=[
    "🤍",
    "💗",
    "💖",
    "💕",
    "🌷",
    "✨"
  ];

  for(let i=0;i<amount;i++){

    const heart =
    document.createElement("div");

    heart.className="heart";

    heart.textContent =
    emojis[
      Math.floor(
        Math.random()*emojis.length
      )
    ];

    heart.style.left =
    Math.random()*90+5+"vw";

    heart.style.top =
    Math.random()*70+20+"vh";

    heart.style.fontSize =
    Math.random()*16+16+"px";

    heart.style.animationDelay =
    Math.random()*.4+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{

      heart.remove();

    },3200);

  }

}


/* CONFETTI */

function createConfetti(){

  for(let i=0;i<70;i++){

    const piece =
    document.createElement("div");

    piece.className="confetti";

    piece.style.left="50vw";
    piece.style.top="45vh";

    piece.style.setProperty(
      "--x",
      ((Math.random()-.5)*100)+"vw"
    );

    piece.style.setProperty(
      "--y",
      ((Math.random()-.2)*100)+"vh"
    );

    document.body.appendChild(piece);

    setTimeout(()=>{

      piece.remove();

    },2500);

  }

}


/* START */

createStars();

createScenes();

setTimeout(()=>{

  createHearts(5);

},800);

</script>
